<aside class="interactive-project-nav" aria-label="Interactive Python projects">

    <div class="interactive-project-nav__header">

        <h2 class="interactive-project-nav__title">Python Lab</h2>
        <p class="interactive-project-nav__intro">Explore runnable Python projects directly in the browser.</p>

    <nav>

                    {% endif %} >
                    <span>
                        <strong>Morse Code Converter</strong>
                        <small>Python · Flask</small>
                    </span>

                    {% if active_project == 'quizzler' %}
                        aria-current="page"
                    {% endif %}
                >
                    <span>
                        <strong>Quizzler</strong>
                        <small>Python · Flask · API</small>
                    </span>

                    <span aria-hidden="true">→</span>

            </li>

    </nav>

    <div class="interactive-project-nav__footer">

        <a
