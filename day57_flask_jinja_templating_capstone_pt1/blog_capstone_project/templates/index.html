<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Capstone Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
<div class="wrapper">
    <div class="top">
        <div class="title"><h1>My Blog</h1></div>
    </div>

    {% for post in posts: %}
         <div class="content">
            <div class="card">
                <h1>{{ post.title }}</h1>
                <h3>{{ post.subtitle }}</h3>
                <p class="text">{{ post.body }} </p>
                <a href="{{ url_for('get_post', id=post.id) }}">Read</a>

            </div>
         </div>
    {% endfor %}
</div>
</body>
<footer>
    <p>Made with ♥️ in Georgia, USA.</p>
</footer>
</html>
